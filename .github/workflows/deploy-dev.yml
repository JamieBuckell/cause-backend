name: Deploy dev backend

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service:
          - campaign
          - comms
          - donors
          - families
          - nominators
          - organisations
          - subscription
          - users
          - hampers

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/main/services/*/package-lock.json

      - name: Install deployment tooling
        run: npm ci --no-audit --no-fund

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::988218197909:role/cause-backend-github-actions
          aws-region: eu-west-2

      - name: Install service dependencies
        run: npm install --prefix "v2/main/services/${{ matrix.service }}" --no-audit --no-fund

      - name: Deploy dev service
        shell: bash
        run: |
          set -euo pipefail
          service="${{ matrix.service }}"
          cd "v2/main/services/${service}"

          if ! node "${GITHUB_WORKSPACE}/node_modules/serverless/scripts/serverless" deploy --stage dev --param="customDomainEnabled=false"; then
            echo "Deployment failed; retrying ${service} once after 20 seconds"
            sleep 20
            node "${GITHUB_WORKSPACE}/node_modules/serverless/scripts/serverless" deploy --stage dev --param="customDomainEnabled=false"
          fi
