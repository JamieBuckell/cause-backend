name: Deploy dev backend

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Serverless services
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/main/services/*/package-lock.json

      - name: Install deployment tooling
        run: npm ci --no-audit --no-fund

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::988218197909:role/cause-backend-github-actions
          aws-region: eu-west-2

      - name: Deploy dev services
        shell: bash
        run: |
          set -euo pipefail

          services=(
            campaign
            comms
            donors
            families
            nominators
            organisations
            subscription
            users
            hampers
          )

          for service in "${services[@]}"; do
            service_dir="v2/main/services/${service}"
            echo "::group::Install ${service} dependencies"
            npm install --prefix "${service_dir}" --no-audit --no-fund
            echo "::endgroup::"

            echo "::group::Deploy ${service}"
            (
              cd "${service_dir}"
              if ! node "${GITHUB_WORKSPACE}/node_modules/serverless/scripts/serverless" deploy --stage dev; then
                echo "Deployment failed; retrying ${service} once after 20 seconds"
                sleep 20
                node "${GITHUB_WORKSPACE}/node_modules/serverless/scripts/serverless" deploy --stage dev
              fi
            )
            echo "::endgroup::"
          done
