      - arn:aws:lambda:eu-west-2:988218197909:layer:uuid:1
  migrateUser:
    handler: lambdas/endpoints/users/migrateData.handler
    events:
        - http:
            method: post
            path: user/migrate-data
            cors: true
            integration: lambda-proxy
            authorizer:
              name: PrivateAuthorizer
              type: COGNITO_USER_POOLS
              arn:
                Fn::GetAtt:
                  - UserPool
                  - Arn
        - http:
            method: post
            path: user/migrate-data-manual
            cors: true
            integration: lambda-proxy
            authorizer:
              name: PrivateAuthorizerV2
              type: COGNITO_USER_POOLS
              arn: ${self:custom.userPools.${self:custom.stage}}
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
  fixReferences:
    handler: lambdas/endpoints/users/fixReferences.handler
    events:
        - http:
            method: post
            path: users/fix-family-references
            cors: true
            integration: lambda-proxy
            authorizer:
