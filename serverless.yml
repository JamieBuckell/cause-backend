service: causef-api

useDotenv: true
frameworkVersion: '3'

plugins:
  - serverless-domain-manager
custom:
  stage: ${opt:stage, self:provider.stage}
  userPools:
    dev: "arn:aws:cognito-idp:eu-west-2:988218197909:userpool/eu-west-2_Tq53Gr5Pd"
    live: "arn:aws:cognito-idp:eu-west-2:988218197909:userpool/eu-west-2_ueeqpE5iq"
  domains:
    live: api.cause-foundation.org.uk
    dev: causeapi.bouchelle.co.uk
  customDomain:
    domainName: ${self:custom.domains.${self:custom.stage}}
    certificateName: "cause-foundation.org.uk"
    basePath: ${self:provider.stage}
    stage: ${self:provider.stage}
    createRoute53Record: true

provider:
  name: aws
  runtime: nodejs14.x
  profile: jamiebuckell
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'eu-west-2'}
  lambdaHashingVersion: 20201221
  environment:
    AWS_ACCOUNT_ID: 988218197909
    AWS_ACCOUNT_REGION: ${self:provider.region}
    WEBSITE_URL: "https://www.cause-foundation.org.uk"
    APP_URL: "https://portal.cause-foundation.org.uk"
    ORGANISATIONS_TABLE: cause-organisations-${self:provider.stage}
    NOMINATORS_TABLE: cause-nominators-${self:provider.stage}
    ORG_ADMINS_TABLE: cause-organisation-admins-${self:provider.stage}
    FAMILIES_TABLE: cause-families-${self:provider.stage}
    FAMILY_MEMBERS_TABLE: cause-family-members-${self:provider.stage}
    DONORS_TABLE: cause-donors-${self:provider.stage}
    CAMPAIGNS_TABLE: cause-campaigns-${self:provider.stage}
    CAMPAIGN_DONORS_TABLE: cause-campaign-donors-${self:provider.stage}
    CAMPAIGN_DONORS_TABLE_OLD: cause-campaign-donors-OLD-${self:provider.stage}
    EMAILS_TABLE: cause-campaign-emails-${self:provider.stage}
    EMAILS_SUBSCRIBERS_TABLE: cause-campaign-emails-subscribers-${self:provider.stage}
    MASTER_TABLE: cause-portal-master-${self:provider.stage}
    MAILER_QUEUE: cause-campaign-mailer-queue-${self:provider.stage}
    MAIL_PROCESSOR_QUEUE: cause-campaign-mail-processor-queue-${self:provider.stage}
    SUBSCRIBER_UPDATE_QUEUE: cause-campaign-subscriber-update-queue-${self:provider.stage}
    PLEDGE_DETAIL_QUEUE: cause-campaign-send-pledge-detail-queue-${self:provider.stage}
    TIMEZONE: "Europe/London"
    DATE_FORMAT: "YYYY-MM-DD HH:mm:ss"
    FROM_ADDRESS: "hampers@cause-foundation.org.uk"
    INTERNAL_ADDRESS: "hampers@cause-foundation.org.uk"
    INTERNAL_ADDRESS_DOMAIN: "@cause-foundation.org.uk"
    HASHING_SALT: "46d6a84b07ce2e"
    USER_POOL: "eu-west-2_AwNh0tGjz"
    USER_POOL_V2: "eu-west-2_ueeqpE5iq"
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:DescribeTable
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
      Resource: 
        - "Fn::GetAtt": [ MasterTable, Arn ]
        - { "Fn::Join": [ "/", [ 
          { "Fn::GetAtt": ["MasterTable", "Arn" ] }, "index", "GSI1PKRequest" 
        ]]}
        - { "Fn::Join": [ "/", [ 
          { "Fn::GetAtt": ["MasterTable", "Arn" ] }, "index", "GSI1SKRequest" 
        ]]}
    - Effect: 'Allow'
      Action:
        - "ses:SendEmail"
        - "ses:SendTemplatedEmail"
        - "ses:SendRawEmail"
      Resource:
        - arn:aws:ses:eu-west-1:988218197909:identity/jamiebuckell.co.uk
        - arn:aws:ses:eu-west-1:988218197909:identity/cause-foundation.org.uk
        - arn:aws:ses:eu-west-1:988218197909:configuration-set/cause-failure-configuration
    - Effect: Allow
      Action: 
        - "ses:GetTemplate"
      Resource: 
        - "*"
    - Effect: Allow
      Action: 
        - "s3:PutObject"
      Resource: 
        - !Sub 
          - "arn:aws:s3:::causef.jamiebuckell.co.uk/*"
          - BucketArn: arn:aws:s3:::causef.jamiebuckell.co.uk
        - arn:aws:s3:::causef.jamiebuckell.co.uk
    - Effect: 'Allow'
      Action:
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminAddUserToGroup
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:ListUsersInGroup
        - cognito-idp:ListUsers
      Resource:
        - arn:aws:cognito-idp:eu-west-2:988218197909:userpool/eu-west-2_AwNh0tGjz
    - Effect: 'Allow'
      Action:
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminAddUserToGroup
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:ListUsersInGroup
        - cognito-idp:ListUsers
      Resource:
        - arn:aws:cognito-idp:eu-west-2:988218197909:userpool/eu-west-2_ueeqpE5iq
    - Effect: 'Allow'
      Action:
        - sqs:SendMessage
      Resource:
        - "Fn::GetAtt": [ SendPledgeDetailQueue, Arn ]
    - Effect: 'Allow'
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:eu-west-2:988218197909:function:pdf-live-downloadPdf
