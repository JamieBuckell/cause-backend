service: causef-api-v2-users

frameworkVersion: "3"

plugins:
  - serverless-domain-manager
custom:
  environment: ${file(../.env.${sls:stage}.yml)}
  customDomain:
    enabled: ${param:customDomainEnabled, true}
    domainName: ${self:custom.environment.CUSTOM_DOMAIN}
    basePath: users
    stage: ${sls:stage}
    createRoute53Record: true
provider:
  name: aws
  runtime: nodejs16.x
  stage: ${sls:stage}
  region: ${self:custom.environment.AWS_ACCOUNT_REGION}
  environment: ${file(../.env.${sls:stage}.yml)}
  apiGateway:
    description: Microservice for organisation specific processes
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "ses:SendEmail"
        - "ses:SendTemplatedEmail"
        - "ses:SendRawEmail"
      Resource:
        - arn:aws:ses:eu-west-1:988218197909:identity/jamiebuckell.co.uk
        - arn:aws:ses:eu-west-1:988218197909:identity/cause-foundation.org.uk
        - arn:aws:ses:eu-west-1:988218197909:configuration-set/cause-failure-configuration
    - Effect: Allow
      Action:
        - dynamodb:DescribeTable
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
      Resource:
        - Fn::Join:
            - ""
            - - "arn:aws:dynamodb:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":table/"
              - ${self:custom.environment.MAIN_DYNAMO_TABLE}
        - Fn::Join:
            - ""
            - - "arn:aws:dynamodb:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":table/"
              - ${self:custom.environment.MAIN_DYNAMO_TABLE}
              - "/index/GSI2"
        - Fn::Join:
            - ""
            - - "arn:aws:dynamodb:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":table/"
              - ${self:custom.environment.EMAIL_TEMPLATES_TABLE}
    - Effect: "Allow"
      Action:
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminAddUserToGroup
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:ListUsersInGroup
        - cognito-idp:ListUsers
      Resource:
        - Fn::Join:
            - ""
            - - "arn:aws:cognito-idp:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":userpool/"
              - ${self:custom.environment.USER_POOL}
package:
  individually: true
  exclude:
    - "**/*"
  include:
    - ../common/**
    - endpoints/**
functions:
  delete:
    handler: endpoints/delete.handler
    events:
      - http:
          method: post
          path: delete/{organisationId}/{emailAddress}
          cors: true
          request:
            parameters:
              paths:
                organisationId: true
          integration: lambda-proxy
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
      - http:
          method: post
          path: delete/{organisationId}/{emailAddress}/{userType}
          cors: true
          request:
            parameters:
              paths:
                organisationId: true
                userType: true
          integration: lambda-proxy
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
  resetPassword:
    handler: endpoints/resetPassword.handler
    events:
      - http:
          method: post
          path: reset-password/{emailAddress}
          cors: true
          request:
            parameters:
              paths:
                emailAddress: true
  resetPasswordCommit:
    handler: endpoints/resetPasswordCommit.handler
    events:
      - http:
          method: post
          path: reset-password-commit/{emailAddress}/{verificationHash}
          cors: true
          request:
            parameters:
              paths:
                emailAddress: true
                verificationHash: true
  list:
    handler: endpoints/list.handler
    events:
      - http:
          method: get
          path: list/{userType}
          cors: true
          request:
            parameters:
              paths:
                userType: true
          integration: lambda-proxy
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
  create:
    handler: endpoints/create.handler
    events:
      - http:
          method: post
          path: create/{userType}
          cors: true
          request:
            parameters:
              paths:
                userType: true
          integration: lambda-proxy
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
  getMe:
    handler: endpoints/me.handler
    events:
      - http:
          method: get
          path: me
          cors: true
          integration: lambda-proxy
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
  fixReferences:
    handler: endpoints/fixReferences.handler
    events:
      - http:
          method: post
          path: fix-family-references
          cors: true
          integration: lambda-proxy
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
    timeout: 30
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
resources:
  - ${file(../resources/api-gateway-responses.yml)}
