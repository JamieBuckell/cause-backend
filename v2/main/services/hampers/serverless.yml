service: causef-api-v2-hampers

frameworkVersion: "3"

plugins:
  - serverless-domain-manager
custom:
  environment: ${file(../.env.${sls:stage}.yml)}
  customDomain:
    enabled: ${param:customDomainEnabled, true}
    domainName: ${self:custom.environment.CUSTOM_DOMAIN}
    basePath: hampers
    stage: ${sls:stage}
    createRoute53Record: true

provider:
  name: aws
  runtime: nodejs14.x
  stage: ${sls:stage}
  region: ${self:custom.environment.AWS_ACCOUNT_REGION}
  environment: ${file(../.env.${sls:stage}.yml)}
  apiGateway:
    description: Microservice for hamper specific processes
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:DescribeTable
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
      Resource:
        - Fn::Join:
            - ""
            - - "arn:aws:dynamodb:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":table/"
              - ${self:custom.environment.MAIN_DYNAMO_TABLE}
        - Fn::Join:
            - ""
            - - "arn:aws:dynamodb:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":table/"
              - ${self:custom.environment.MAIN_DYNAMO_TABLE}
              - "/index/GSI1"
        - Fn::Join:
            - ""
            - - "arn:aws:dynamodb:eu-west-2:"
              - ${self:custom.environment.AWS_ACCOUNT_ID}
              - ":table/"
              - ${self:custom.environment.MAIN_DYNAMO_TABLE}
              - "/index/GSI2"
    - Effect: "Allow"
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:eu-west-2:988218197909:function:PdfGeneratorV2Stack-HtmlToPdfLambdaB7443488-LJXTgl6nvBE2
package:
  individually: true
  exclude:
    - "**/*"
  include:
    - ../common/**
    - endpoints/**
functions:
  check:
    handler: endpoints/check.handler
    events:
      - http:
          method: post
          path: check
          cors: true
  receive:
    handler: endpoints/receive.handler
    events:
      - http:
          method: post
          path: receive
          cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
  markDirect:
    handler: endpoints/markDirect.handler
    events:
      - http:
          method: post
          path: mark-direct
          cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
  markDirectBulk:
    handler: endpoints/markDirectBulk.handler
    events:
      - http:
          method: post
          path: mark-direct-bulk
          cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
  screen:
    handler: endpoints/screen.handler
    events:
      - http:
          method: get
          path: screen/{campaignId}
          cors: true
          request:
            parameters:
              paths:
                campaignId: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
  overview:
    handler: endpoints/overview.handler
    events:
      - http:
          method: get
          path: get-overview/{hamperRef}
          cors: true
          request:
            parameters:
              paths:
                hamperRef: true
  undeliveredHampers:
    handler: endpoints/undelivered.handler
    events:
      - http:
          method: get
          path: undelivered
          cors: true
          response:
            statusCodes:
              400:
                pattern: '.*"error".*'
                template: $input.path('$.errorMessage')
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
  undeliveredDonors:
    handler: endpoints/undeliveredDonors.handler
    events:
      - http:
          method: get
          path: undelivered-donors
          cors: true
          response:
            statusCodes:
              400:
                pattern: '.*"error".*'
                template: $input.path('$.errorMessage')
          authorizer:
            name: PrivateAuthorizerV2
            type: COGNITO_USER_POOLS
            arn: ${self:custom.environment.USER_POOL_ARN}
resources:
  - ${file(../resources/api-gateway-responses.yml)}
