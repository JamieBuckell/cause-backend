service: causef-api-v2-feedback

useDotenv: true
frameworkVersion: '3'

plugins:
  - serverless-domain-manager
custom:
  stage: ${opt:stage, self:provider.stage}
  userPools:
    dev: "arn:aws:cognito-idp:eu-west-2:988218197909:userpool/eu-west-2_Tq53Gr5Pd"
    live: "arn:aws:cognito-idp:eu-west-2:988218197909:userpool/eu-west-2_ueeqpE5iq"
  domains:
    live: api.cause-foundation.org.uk
    dev: causeapi.bouchelle.co.uk
  customDomain:
    domainName: ${self:custom.domains.${self:custom.stage}}
    basePath: feedback
    stage: ${self:provider.stage}
    createRoute53Record: true

provider:
  name: aws
  runtime: nodejs14.x
  profile: jamiebuckell
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'eu-west-2'}
  apiGateway:
    description: Microservice for feedback specific processes
  environment: ${file(../resources/.env.${self:custom.stage}.yml):}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:DescribeTable
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
      Resource:
        - Fn::Join:
          - ""
          - - "arn:aws:dynamodb:eu-west-2:"
            - ${self:provider.environment.AWS_ACCOUNT_ID}
            - ":table/"
            - ${self:provider.environment.MAIN_DYNAMO_TABLE}
        - Fn::Join:
          - ""
          - - "arn:aws:dynamodb:eu-west-2:"
            - ${self:provider.environment.AWS_ACCOUNT_ID}
            - ":table/"
            - ${self:provider.environment.MAIN_DYNAMO_TABLE}
            - "/index/GSI1"
        - Fn::Join:
          - ""
          - - "arn:aws:dynamodb:eu-west-2:"
            - ${self:provider.environment.AWS_ACCOUNT_ID}
            - ":table/"
            - ${self:provider.environment.MAIN_DYNAMO_TABLE}
            - "/index/GSI2"
        - "Fn::GetAtt": [ FeedbackTable, Arn ]
        - Fn::Join:
          - ""
          - - "arn:aws:dynamodb:eu-west-2:"
            - ${self:provider.environment.AWS_ACCOUNT_ID}
            - ":table/cause-campaign-feedback-live"
    - Effect: 'Allow'
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:eu-west-2:988218197909:function:pdf-live-downloadPdf
package:
  individually: true
  exclude:
      - '**/*'
  include:
      - ../common/**
      - endpoints/**
functions:
  volunteer:
    handler: endpoints/volunteer.handler
    events:
        - http:
            method: post
            path: volunteer
            cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
      - arn:aws:lambda:eu-west-2:988218197909:layer:crypto:1
  hamper:
    handler: endpoints/hamper.handler
    events:
        - http:
            method: post
            path: hamper
            cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:moment:1
      - arn:aws:lambda:eu-west-2:988218197909:layer:crypto:1
  hamperCheck:
    handler: endpoints/hamperCheck.handler
    events:
        - http:
            method: post
            path: hampers/check
            cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:crypto:1
  getHamper:
    handler: endpoints/getHamper.handler
    events:
        - http:
            method: get
            path: hampers/list/{campaignId}
            cors: true
            request: 
              parameters: 
                paths: 
                  campaignId: true
            authorizer:
              name: PrivateAuthorizerV2
              type: COGNITO_USER_POOLS
              arn: ${self:custom.userPools.${self:custom.stage}}
  getVolunteer:
    handler: endpoints/getVolunteer.handler
    events:
        - http:
            method: get
            path: volunteers/list/{campaignId}
            cors: true
            request: 
              parameters: 
                paths: 
                  campaignId: true
            authorizer:
              name: PrivateAuthorizerV2
              type: COGNITO_USER_POOLS
              arn: ${self:custom.userPools.${self:custom.stage}}
  generatePdf:
    handler: endpoints/generatePdf.handler
    events:
        - http:
            method: post
            path: hampers/generate
            cors: true
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:crypto:1
  transfer:
    handler: endpoints/transfer.handler
    timeout: 180
    layers:
      - arn:aws:lambda:eu-west-2:988218197909:layer:crypto:1
      - arn:aws:lambda:eu-west-2:988218197909:layer:uuid:1
resources:
  - ${file(../resources/feedback-table.yml)}
  - ${file(../resources/api-gateway-responses.yml)}