Resources:
  OrganisationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:provider.environment.ORGANISATIONS_TABLE}
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: organisationName
          AttributeType: S
        - AttributeName: campaignId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: organisationRequest
          KeySchema:
            - AttributeName: organisationName
              KeyType: HASH
            - AttributeName: campaignId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
      BillingMode: PROVISIONED